# Included from the qerope.me server block (https://qerope.me/spotube/).
location ^~ /spotube/ {
    proxy_pass http://127.0.0.1:8770/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    client_max_body_size 20m;
}
# Audio files, served by nginx (with Range support) after the API authorises the request.
location ^~ /spotube-cache/ {
    internal;
    alias /opt/spotube/data/cache/;
    types { audio/mp4 m4a; }
    add_header Cache-Control "private, max-age=86400";
}
# AltStore source (public): add https://qerope.me/spotube/altstore/source.json in AltStore > Sources.
location ^~ /spotube/altstore/ {
    alias /opt/spotube/data/altstore/;
    types { application/json json; application/octet-stream ipa; image/png png; }
    add_header Cache-Control "no-cache";
    add_header Access-Control-Allow-Origin "*";
}
