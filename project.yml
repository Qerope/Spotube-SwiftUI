name: SpotubeLite
options: { bundleIdPrefix: dev.qerope, deploymentTarget: { macOS: "14.0", iOS: "17.0" } }
targets:
  SpotubeLite:
    type: application
    supportedDestinations: [macOS, iOS]
    sources: [Sources, { path: Plugins, buildPhase: resources }]
    info:
      path: Sources/Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchScreen: { UIColorName: "" }
        CFBundleDisplayName: Spotube Lite
        LSApplicationCategoryType: public.app-category.music
    entitlements:
      path: Sources/App.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    settings: { SWIFT_VERSION: "5.0", GENERATE_INFOPLIST_FILE: YES, CODE_SIGN_STYLE: Automatic, CODE_SIGN_IDENTITY: "-", ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon, MARKETING_VERSION: "1.0.0", CURRENT_PROJECT_VERSION: "1" }
